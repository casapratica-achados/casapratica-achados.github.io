# Libera os pins agendados nos feeds RSS (de hora em hora). Gerado por `central-core site iniciar`.
name: liberar
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: liberar
  cancel-in-progress: false
jobs:
  liberar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Montar feeds
        run: python liberar.py
      - name: Publicar feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          git diff --cached --quiet || (git commit -m "feeds: liberar" && git push)
